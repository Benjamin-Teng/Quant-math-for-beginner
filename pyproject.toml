[project]
name = "calculus-to-kelly"
version = "0.1.0"
description = "From Calculus to Kelly: a self-study quantitative-finance textbook (static site, A4 PDFs, Jupyter labs)"
requires-python = ">=3.13,<3.14"   # the minor version the labs were run with (3.13); patch versions may differ
dependencies = [
    "arch>=8.0",
    "cvxpy>=1.9.3",
    "ipykernel>=6.29",
    "markdown-it-py>=3",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
    "nbformat>=5.9",
    "numpy>=1.26",
    "playwright>=1.44",
    "polars>=1.0",
    "pyarrow>=15",
    "pygments>=2.17",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18",
    "statsmodels>=0.15",
    "sympy>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ty.environment]
# the scripts import their neighbours (build_index.py imports build/build.py; data/*.py import one another),
# so resolve modules from both script folders first, as Python does when it runs them. Blind spot: ty then also
# accepts an import from the other folder (data/ importing build_index, say), which fails at run time.
extra-paths = ["build", "data"]

title: From Calculus to Kelly
subtitle: A quantitative curriculum for statistical modeling, portfolio optimization and optimal leverage
# Edition notes, newest first. A module is linked from the site only when its entry below has `status: published`.
editions:
  - version: "0.3"
    date: 17 October 2026
    notes: "Volume II complete: LM8–LM12 with their labs, from vectors and matrices through linear systems, covariance matrices and principal components to Cholesky, SVD and least squares, on TAIEX, the TWSE sector indices, Taiwan ETFs and TAIEX futures. Each module passed an independent review, a blind solve of every question, a full audit of its numbers from the raw data and a check across the volume, then two verified revision rounds and a closing check. Volume I now links forward to the Volume II modules that build on it."
  - version: "0.2.1"
    date: 11 October 2026
    notes: "Volumes V to VII reordered so that portfolio optimization and risk measurement come before stochastic calculus: LM27–31 are now Portfolio Optimization (formerly LM32–36), LM32–35 Measuring True Risk and Return (formerly LM37–40) and LM36–40 Stochastic Calculus (formerly LM27–31). The old numbers belonged only to modules not yet published. In Volume I the references follow the new numbers, and a few hyphens, semicolons and colons after formulas were rewritten so that none can start a line. A Getting Started page and a Research hygiene page open the book."
  - version: "0.2"
    date: 11 October 2026
    notes: "Volume I complete: LM1–LM7 with their labs. Each module passed an independent review, a blind solve of every question with a key check, a full audit of its numbers from the raw data and verified revision rounds; LM3 was revised the same way. Wide formulas and tables now fit the printed page, and equation numbers and punctuation no longer collide with formulas."
  - version: "0.1"
    date: 10 October 2026
    notes: "Roadmap, contents and conventions, and the sample module LM3 with its lab. Volumes are released in order, starting with Volume I."
# Standalone pages, written in src/pages/<slug>.md (front matter: title, description). Like a module, a page is linked
# from the site and built into docs/ only with `status: published`; without it, only the preview build shows it (as a draft).
pages:
  - {slug: getting-started, title: "Getting Started", status: published}
  - {slug: research-hygiene, title: "Research hygiene", status: published}
volumes:
  - id: I
    title: Calculus for Finance
    blurb: Compounding, approximation and optimization — the language every later volume is written in.
    lms:
      - {n: 1, title: "Exponentials, Logarithms and Compounding", desc: "Discrete vs continuous compounding; simple vs log returns; why logs make time additive.", status: published}
      - {n: 2, title: "Limits and Derivatives", desc: "Marginal thinking, the chain rule, elasticity; duration as a derivative.", status: published}
      - {n: 3, title: "Taylor Series and Approximation", desc: "Local polynomial models, error bounds, volatility drag, leveraged-ETF decay, duration–convexity.", status: published}
      - {n: 4, title: "Optimization in One Variable", desc: "First- and second-order conditions, concavity, the binary Kelly bet, Newton's method.", status: published}
      - {n: 5, title: "Integration", desc: "Areas, accumulation and expectation as an integral; the Gaussian integral.", status: published}
      - {n: 6, title: "Sequences, Series and the Time Value of Money", desc: "Geometric series, annuities, perpetuities, bond and dividend-discount pricing.", status: published}
      - {n: 7, title: "Multivariable Calculus and Lagrange Multipliers", desc: "Gradients, Hessians, multivariate Taylor, constrained optimization; the two-asset minimum-variance portfolio.", status: published}
  - id: II
    title: Linear Algebra for Portfolios
    blurb: Portfolios are vectors and risk is a quadratic form; this volume makes that literal.
    lms:
      - {n: 8, title: "Vectors and Matrices", desc: "Weights, returns and the dot product; portfolio return as wᵀR.", status: published}
      - {n: 9, title: "Linear Systems, Inverses and Rank", desc: "Solving for a replicating mix; singular matrices as perfect collinearity.", status: published}
      - {n: 10, title: "Quadratic Forms and Covariance Matrices", desc: "wᵀΣw, positive (semi)definiteness, matrix calculus.", status: published}
      - {n: 11, title: "Eigen-decomposition and PCA", desc: "Principal components of Taiwan sector returns; condition numbers and why Σ⁻¹ amplifies error.", status: published}
      - {n: 12, title: "Cholesky, SVD and Least Squares", desc: "Cholesky factors and whitening; SVD and numerical rank; least squares as a projection.", status: published}
  - id: III
    title: Probability
    blurb: Random variables as functions, expectation as the workhorse, and the distributions markets actually produce.
    lms:
      - {n: 13, title: "Probability Foundations and Bayes", desc: "Sample spaces, conditional probability, Bayes' rule; a random variable is a function."}
      - {n: 14, title: "Random Variables, Expectation and Jensen's Inequality", desc: "LOTUS, moments, E[R²] = σ² + μ², and the real reason for volatility drag."}
      - {n: 15, title: "Distributions in Finance", desc: "Normal, lognormal, Student-t and Poisson, fitted to TAIEX returns."}
      - {n: 16, title: "Joint Distributions and Dependence", desc: "Covariance, conditional expectation, the multivariate normal, crash correlation."}
      - {n: 17, title: "Law of Large Numbers and Central Limit Theorem", desc: "Why the median path, not the mean path, is what you live through."}
      - {n: 18, title: "Monte Carlo Simulation and the Bootstrap", desc: "Random generation, simulation error, variance reduction, resampling."}
  - id: IV
    title: Statistical Inference and Econometrics
    blurb: Turning a return series into estimates you can defend, with their uncertainty attached.
    lms:
      - {n: 19, title: "Descriptive Statistics of Returns", desc: "Location, dispersion, shape; the √T rule and when it fails."}
      - {n: 20, title: "Estimation Theory and Maximum Likelihood", desc: "Bias, variance, MSE; why SE(μ̂) = σ/√T ignores sampling frequency."}
      - {n: 21, title: "Hypothesis Testing and Multiple Testing", desc: "p-values, power, Bonferroni and FDR; the t > 3 hurdle for strategies."}
      - {n: 22, title: "Resampling Methods", desc: "Block and stationary bootstrap; confidence intervals for Sharpe and Kelly."}
      - {n: 23, title: "Linear Regression", desc: "From simple to multiple OLS in matrix form; HAC errors; CAPM beta and factor models."}
      - {n: 24, title: "Bayesian Inference and Shrinkage", desc: "Priors, posteriors, James–Stein; when fractional Kelly is a Bayesian answer."}
      - {n: 25, title: "Time Series I: ARMA, Unit Roots and Cointegration", desc: "Stationarity, mean reversion, the futures–spot basis."}
      - {n: 26, title: "Time Series II: Volatility Models", desc: "EWMA, GARCH, and realized volatility from 5-second TAIEX data."}
  - id: V
    title: Portfolio Optimization
    blurb: Mean–variance theory, the convex machinery to solve it, and the estimation error that breaks it.
    lms:
      - {n: 27, title: "Portfolio Return and Risk", desc: "N-asset portfolio mathematics in matrix form."}
      - {n: 28, title: "Mean–Variance Optimization", desc: "Lagrangian derivation, global minimum variance, the frontier, tangency and the CML."}
      - {n: 29, title: "Convex Optimization in Practice", desc: "Quadratic programs, KKT conditions, cvxpy; long-only, leverage and turnover limits."}
      - {n: 30, title: "Estimation Error and Robust Portfolios", desc: "The 1/N puzzle, Ledoit–Wolf shrinkage, Black–Litterman, resampling."}
      - {n: 31, title: "Risk Parity, HRP and Volatility Targeting", desc: "Euler risk contributions and risk-based allocation."}
  - id: VI
    title: Measuring True Risk and Return
    blurb: What a track record really says once compounding, fat tails, costs and selection are accounted for.
    lms:
      - {n: 32, title: "VaR, Expected Shortfall and Drawdown", desc: "Parametric, historical and Monte Carlo VaR; ES; drawdown statistics."}
      - {n: 33, title: "The Statistics of the Sharpe Ratio", desc: "Standard errors (Lo 2002), Probabilistic and Deflated Sharpe, minimum track record."}
      - {n: 34, title: "Backtesting Without Fooling Yourself", desc: "Survivorship and look-ahead bias, Taiwan taxes and fees, walk-forward, PBO."}
      - {n: 35, title: "Stress Testing", desc: "Taiwan crash scenarios (2008, 2015, 2020, 2024/8/5, 2025/4/7) and overnight gaps, replayed on a portfolio."}
  - id: VII
    title: Stochastic Calculus
    blurb: The continuous-time tools behind GBM, Itô's lemma and the continuous Kelly result that Volume VIII builds on.
    lms:
      - {n: 36, title: "From Random Walk to Brownian Motion", desc: "Scaling limits, quadratic variation, and what (dB)² = dt really means."}
      - {n: 37, title: "The Itô Integral and Itô's Lemma", desc: "Itô's lemma derived as a Taylor expansion that keeps its second-order term."}
      - {n: 38, title: "Geometric Brownian Motion", desc: "Solving the SDE; lognormal prices; mean, median and mode."}
      - {n: 39, title: "Beyond GBM", desc: "Ornstein–Uhlenbeck spreads, Merton jumps for Taiwan gap days, stochastic volatility."}
      - {n: 40, title: "Option Pricing Bridge (Optional)", desc: "Black–Scholes by delta hedging; Greeks; TXO and warrants."}
  - id: VIII
    title: The Kelly Criterion and Optimal Leverage
    blurb: Growth-optimal sizing from the binary bet to multi-asset leverage under uncertainty.
    lms:
      - {n: 41, title: "Discrete Kelly", desc: "Beyond LM4's binary bet: general discrete outcomes, the ruin boundary, position vs risk size, and what log utility assumes."}
      - {n: 42, title: "Continuous-Time Kelly", desc: "g(f) by Itô, f* = SR/σ, g* = r + SR²/2, and the 2f* ruin line."}
      - {n: 43, title: "Multi-Asset Kelly", desc: "f* = Σ⁻¹(μ − r): the tangency portfolio, levered."}
      - {n: 44, title: "Fractional Kelly and Drawdown Control", desc: "CRRA equivalence, drawdown probabilities, risk-constrained Kelly."}
      - {n: 45, title: "Kelly Under Uncertainty and Frictions", desc: "Parameter uncertainty, fat tails and jumps, rebalancing, financing costs, bootstrap Kelly."}
      - {n: 46, title: "Leverage Instruments in Practice", desc: "TX, MTX and TMF futures; 00631L and TQQQ; margin regimes."}
  - id: IX
    title: Capstone
    blurb: Everything assembled into working research pipelines on Taiwan and US data.
    lms:
      - {n: 47, title: "The Statistical Modeling Workflow", desc: "Data, model, diagnostics, decision — end to end."}
      - {n: 48, title: "Capstone A: A Taiwan Core–Satellite Portfolio", desc: "Mean–variance vs risk parity vs Kelly, compared walk-forward."}
      - {n: 49, title: "Capstone B: Kelly Sizing a Single Strategy", desc: "From backtest returns to fractional Kelly on TX futures, uncertainty included."}
      - {n: 50, title: "Capstone C: Multi-Strategy Allocation and Monitoring", desc: "Constrained multi-strategy Kelly, re-estimation and monitoring."}
